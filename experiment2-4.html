<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Registration Form</title> 
<style> 
body { 
font-family: Arial, sans-serif; 
background-color: #f0f8ff; 
} 
h1 { 
text-align: center; 
color: #4caf50; 
} 
table { 
margin: 0 auto;
border-collapse: collapse; 
width: 50%; 
background-color: #fff; 
box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); 
} 
td { 
padding: 10px; 
vertical-align: top; 
} 
th { 
text-align: left; 
padding: 10px; 
background-color: #4caf50; 
color: #fff; 
} 
input, select, textarea, button { 
width: 100%; 
padding: 8px; 
margin: 5px 0; 
border: 1px solid #ccc; 
border-radius: 4px; 
} 
button { 
width: 48%; 
padding: 10px; 
background-color: #4caf50; 
color: white; 
border: none; 
cursor: pointer; 
}
button:hover { 
background-color: #45a049; 
} 
</style> 
</head> 
<body> 
<h1>Registration Form</h1> 
<form action="#" method="post"> 
<table border="1"> 
<tr> 
<th colspan="2">Personal Details</th> 
</tr> 
<tr> 
<td>Full Name:</td> 
<td><input type="text" name="fullname" placeholder="Enter your full name" required></td> 
</tr> 
<tr> 
<td>Password:</td> 
<td><input type="password" name="password" placeholder="Enter your password" required></td> 
</tr> 
<tr> 
<td>Date of Birth:</td> 
<td><input type="date" name="dob" required></td> 
</tr> 
<tr> 
<td>Gender:</td> 
<td> 
<select name="gender" required> 
<option value="" disabled selected>Select your gender</option>
<option value="male">Male</option> 
<option value="female">Female</option> 
<option value="other">Other</option> 
</select> 
</td> 
</tr> 
<tr> 
<td>Phone Number:</td> 
<td><input type="number" name="phone" placeholder="Enter your phone number" required></td> 
</tr> 
<tr> 
<td>Address:</td> 
<td><textarea name="address" rows="4" placeholder="Enter your address"></textarea></td> 
</tr> 
<tr> 
<td>Hobbies:</td> 
<td>

</tr> 
<tr> 
<td>Preferred Mode of Study:</td>

<option value="mtech">M.Tech</option>

</tr> 
<tr>

</table>
